
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Learning Portfolio</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- แจ้งเตือน -->
    <div id="toast-area" aria-live="polite"></div>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark shadow-sm py-3 mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="#">
                Welcome!
                <span class="fw-light fs-6 text-light opacity-75">Learning Portfolio</span>
            </a>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-light btn-sm" id="btn-sample">โหลดข้อมูลตัวอย่าง</button>
                <button class="btn btn-outline-danger btn-sm" id="btn-clear">ล้างข้อมูลทั้งหมด</button>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="row g-4">

            <!-- Sidebar -->
            <div class="col-lg-4">
                <div class="card p-3 mb-4 shadow-sm">

                    <h5 class="fw-bold mb-3">
                        Portfolios
                        <span class="badge bg-secondary fs-6" id="portfolio-count">0</span>
                    </h5>

                    <div class="list-group mb-3" id="portfolio-list"></div>

                    <hr class="text-muted">

                    <h6 class="fw-bold text-primary mb-3">สร้าง Portfolio ใหม่</h6>

                    <form id="portfolio-form" class="needs-validation" novalidate>

                        <div class="mb-3">
                            <label for="name" class="form-label small fw-semibold">ชื่อที่ต้องการแสดง *</label>
                            <input type="text" class="form-control" id="name" name="name" required placeholder="ชื่อจริง หรือชื่อสมมติ">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="mb-3">
                            <label for="enjoy" class="form-label small fw-semibold">What I Enjoy *</label>
                            <textarea class="form-control" id="enjoy" name="enjoy" rows="2" required placeholder="ชอบทำอะไร..."></textarea>
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="mb-3">
                            <label for="tried" class="form-label small fw-semibold">What I've Tried *</label>
                            <textarea class="form-control" id="tried" name="tried" rows="2" required placeholder="ลองทำอะไรมาแล้วบ้าง..."></textarea>
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="mb-3">
                            <label for="curious" class="form-label small fw-semibold">What I'm Curious About *</label>
                            <textarea class="form-control" id="curious" name="curious" rows="2" required placeholder="สนใจอยากรู้อะไรเพิ่ม..."></textarea>
                            <div class="invalid-feedback"></div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 shadow-sm">สร้าง Portfolio</button>
                    </form>
                </div>
            </div>
