
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Learning Portfolio</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- แจ้งเตือน -->
    <div id="toast-area" aria-live="polite"></div>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark shadow-sm py-3 mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="#">
                Welcome!
                <span class="fw-light fs-6 text-light opacity-75">Learning Portfolio</span>
            </a>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-light btn-sm" id="btn-sample">โหลดข้อมูลตัวอย่าง</button>
                <button class="btn btn-outline-danger btn-sm" id="btn-clear">ล้างข้อมูลทั้งหมด</button>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="row g-4">

            <!-- Sidebar -->
            <div class="col-lg-4">
                <div class="card p-3 mb-4 shadow-sm">

                    <h5 class="fw-bold mb-3">
                        Portfolios
                        <span class="badge bg-secondary fs-6" id="portfolio-count">0</span>
                    </h5>

                    <div class="list-group mb-3" id="portfolio-list"></div>

                    <hr class="text-muted">

                    <h6 class="fw-bold text-primary mb-3">สร้าง Portfolio ใหม่</h6>

                    <form id="portfolio-form" class="needs-validation" novalidate>

                        <div class="mb-3">
                            <label for="name" class="form-label small fw-semibold">ชื่อที่ต้องการแสดง *</label>
                            <input type="text" class="form-control" id="name" name="name" required placeholder="ชื่อจริง หรือชื่อสมมติ">
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="mb-3">
                            <label for="enjoy" class="form-label small fw-semibold">What I Enjoy *</label>
                            <textarea class="form-control" id="enjoy" name="enjoy" rows="2" required placeholder="ชอบทำอะไร..."></textarea>
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="mb-3">
                            <label for="tried" class="form-label small fw-semibold">What I've Tried *</label>
                            <textarea class="form-control" id="tried" name="tried" rows="2" required placeholder="ลองทำอะไรมาแล้วบ้าง..."></textarea>
                            <div class="invalid-feedback"></div>
                        </div>

                        <div class="mb-3">
                            <label for="curious" class="form-label small fw-semibold">What I'm Curious About *</label>
                            <textarea class="form-control" id="curious" name="curious" rows="2" required placeholder="สนใจอยากรู้อะไรเพิ่ม..."></textarea>
                            <div class="invalid-feedback"></div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 shadow-sm">สร้าง Portfolio</button>
                    </form>
                </div>
            </div>
<!-- Main Content -->
            <div class="col-lg-8">

                <!-- Empty State -->
                <div id="empty-state" class="card text-center p-5 shadow-sm">
                    <div class="py-5">
                        <h4 class="text-muted mb-2">ยังไม่มี Portfolio</h4>
                        <p class="text-secondary small">สร้าง Portfolio ทางซ้าย หรือกด “โหลดข้อมูลตัวอย่าง” ด้านบนเพื่อเริ่มต้นใช้งาน</p>
                    </div>
                </div>

                <!-- Portfolio Details -->
                <div id="portfolio-view" style="display: none;">

                    <div class="card p-4 mb-4 bg-white shadow-sm">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h3 id="v-name" class="text-dark fw-bold m-0">-</h3>
                            <button class="btn btn-outline-danger btn-sm" id="btn-delete-portfolio">ลบ Portfolio</button>
                        </div>

                        <div class="row g-3 small bg-light p-3 rounded-3 mb-4">
                            <div class="col-md-4">
                                <strong class="text-muted d-block mb-1">WHAT I ENJOY</strong>
                                <span id="v-enjoy" class="text-dark">-</span>
                            </div>
                            <div class="col-md-4">
                                <strong class="text-muted d-block mb-1">WHAT I'VE TRIED</strong>
                                <span id="v-tried" class="text-dark">-</span>
                            </div>
                            <div class="col-md-4">
                                <strong class="text-muted d-block mb-1">WHAT I'M CURIOUS ABOUT</strong>
                                <span id="v-curious" class="text-dark">-</span>
                            </div>
                        </div>

                        <!-- JSON -->
                        <div class="d-flex gap-2 mb-2">
                            <button class="btn btn-outline-secondary btn-sm" id="btn-export">แสดง/ซ่อน JSON</button>
                            <button class="btn btn-outline-primary btn-sm" id="btn-copy">คัดลอก JSON</button>
                        </div>

                        <div id="json-box" class="mt-2" hidden>
                            <textarea class="form-control font-monospace bg-dark text-light" id="json-text" rows="8" readonly></textarea>
                        </div>
                    </div>

                    <!-- Portfolio Items -->
                    <div class="card p-4 mb-4 shadow-sm">
                        <h5 class="fw-bold mb-3">
                            Portfolio Items
                            <span class="badge bg-primary fs-6" id="item-count">0</span>
                        </h5>
                        <div id="item-list" class="row g-3"></div>
                    </div>

                    <!-- Add Item -->
                    <div class="card p-4 shadow-sm">
                        <h5 class="fw-bold text-success mb-3">เพิ่ม Portfolio Item</h5>

                        <form id="item-form" class="needs-validation" novalidate>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="title" class="form-label small fw-semibold">Title *</label>
                                    <input type="text" class="form-control" id="title" name="title" required placeholder="ชื่อผลงานหรือกิจกรรม">
                                    <div class="invalid-feedback"></div>
                                </div>

                                <div class="col-md-3">
                                    <label for="type" class="form-label small fw-semibold">Type *</label>
                                    <select class="form-select" id="type" name="type" required>
                                        <option value="">-- เลือกประเภท --</option>
                                        <option value="Course Assignment">Course Assignment</option>
                                        <option value="Project">Project</option>
                                        <option value="Activity">Activity</option>
                                        <option value="Self-Learning">Self-Learning</option>
                                    </select>
                                    <div class="invalid-feedback"></div>
                                </div>

                                <div class="col-md-3">
                                    <label for="date" class="form-label small fw-semibold">Date *</label>
                                    <input type="date" class="form-control" id="date" name="date" required>
                                    <div class="invalid-feedback"></div>
                                </div>
                            </div>

                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label for="role" class="form-label small fw-semibold">Role *</label>
                                    <input type="text" class="form-control" id="role" name="role" required placeholder="เช่น Developer, Designer">
                                    <div class="invalid-feedback"></div>
                                </div>

                                <div class="col-md-6">
                                    <label for="skills" class="form-label small fw-semibold">Skills * (คั่นด้วยเครื่องหมายจุลภาค ,)</label>
                                    <input type="text" class="form-control" id="skills" name="skills" required placeholder="HTML, CSS, JavaScript">
                                    <div class="invalid-feedback"></div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label small fw-semibold">Description *</label>
                                <textarea class="form-control" id="description" name="description" rows="2" required placeholder="รายละเอียดภาพรวมของผลงาน..."></textarea>
                                <div class="invalid-feedback"></div>
                            </div>

            
<!-- Reflection -->
<div class="p-3 bg-light rounded-3 mb-3">
    <h6 class="small fw-bold text-secondary mb-3">Reflection</h6>

    <div class="row g-3">

        <div class="col-md-6">
            <label for="whatIDid" class="form-label small text-muted">
                What I did *
            </label>
            <input type="text" class="form-control" id="whatIDid"
                name="whatIDid" required placeholder="สิ่งที่ได้ทำ">
            <div class="invalid-feedback"></div>
        </div>

        <div class="col-md-6">
            <label for="whatILearned" class="form-label small text-muted">
                What I learned *
            </label>
            <input type="text" class="form-control" id="whatILearned"
                name="whatILearned" required placeholder="สิ่งที่ได้เรียนรู้">
            <div class="invalid-feedback"></div>
        </div>

        <div class="col-md-6">
            <label for="challenge" class="form-label small text-muted">
                Challenge *
            </label>
            <input type="text" class="form-control" id="challenge"
                name="challenge" required placeholder="อุปสรรคหรือความท้าทาย">
            <div class="invalid-feedback"></div>
        </div>

        <div class="col-md-6">
            <label for="nextStep" class="form-label small text-muted">
                Next step *
            </label>
            <input type="text" class="form-control" id="nextStep"
                name="nextStep" required placeholder="ก้าวต่อไป">
            <div class="invalid-feedback"></div>
        </div>

    </div>
</div>

<!-- Evidence -->
<div class="mb-3">
    <label for="evidence" class="form-label small fw-semibold">
        Evidence URL * (ลิงก์หลักฐาน)
    </label>

    <textarea class="form-control" id="evidence"
        name="evidence" rows="2" required
        placeholder="https://example.com/my-work"></textarea>

    <div class="invalid-feedback"></div>
</div>

<!-- Buttons -->
<div class="d-flex gap-2">

    <button type="submit"
        class="btn btn-success flex-grow-1 shadow-sm">
        บันทึก Item
    </button>

    <button type="reset"
        class="btn btn-outline-secondary" id="item-reset">
        ล้างฟอร์ม
    </button>

</div>

</form>
</div>

</div>
</div>

</div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- JavaScript Files -->
<script src="js/samples.js"></script>
<script src="js/app.js"></script>

</body>
</html>
